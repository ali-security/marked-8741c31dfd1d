name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional jasmine --filter regex; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        node_version: ['lts/*', 'node', '14']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: ${{ inputs.test-filter == '' }}
        run: npm run test:specs
      - name: Run Filtered Tests
        if: ${{ inputs.test-filter != '' }}
        run: npm test -- test/unit/**/*-spec.js test/specs/**/*-spec.js --filter="${{ inputs.test-filter }}"
      - name: Build 🗜️
        if: ${{ matrix.node_version == '14' }}
        run: |
          sudo apt-get update && sudo apt-get install -y faketime
          faketime '2021-05-27 16:17:12' npm run build
          git status --short
      - name: Pack
        if: ${{ matrix.node_version == '14' }}
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack 2>/dev/null || (npm pack && mv marked-*.tgz dist-pack/)
          ls -l dist-pack
      - name: Upload tarball
        if: ${{ matrix.node_version == '14' }}
        uses: actions/upload-artifact@v4
        with:
          name: marked-npm-tarball
          path: dist-pack/*.tgz
          if-no-files-found: error
